name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json 의 packageManager 를 따른다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # GC-06-002: 생성 타입이 supabase/migrations 와 같은지(PGlite, Docker 불필요)
      - name: DB types up to date
        run: node scripts/db/gen-types.mjs --check

      # GC-06-003 이 추가한다: supabase test db (Supabase CLI 설치 + supabase start 필요)
      # - name: Supabase RLS tests
      #   run: supabase test db
