# 로컬 개발 환경 (Docker Desktop 기준, GC-D-26). 실행은 `pnpm dev:docker` (scripts/dev/docker.mjs).
# Supabase 로컬 스택은 Supabase CLI 가 따로 기동한다(54321). 여기서는 web · worker 만 올린다.
# 비밀 값은 이미지에 넣지 않는다: 빌드 인자 없음, .env* 복사 없음, 런타임 env_file 로만 주입.
name: globalcommerce

x-local-env: &local-env
  env_file:
    - path: .env.local
      required: true
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web:
    <<: *local-env
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    working_dir: /app
    command: >-
      sh -c "pnpm install --frozen-lockfile &&
      pnpm --filter @gc/web exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      # 소스 마운트: 저장 즉시 반영(hot reload)
      - .:/app
      # 호스트의 node_modules · 빌드 산출물과 섞이지 않게 컨테이너 전용 볼륨으로 가린다
      - web_root_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
      - pnpm_store:/root/.local/share/pnpm/store

  worker:
    <<: *local-env
    build:
      context: .
      # GC-06-007 이 만든다. 로컬과 Railway 배포가 같은 Dockerfile 을 쓴다.
      dockerfile: services/worker/Dockerfile

volumes:
  web_root_node_modules:
  web_app_node_modules:
  web_next_cache:
  pnpm_store:
