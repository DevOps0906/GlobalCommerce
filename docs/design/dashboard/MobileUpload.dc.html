<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 마켓 업로드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Bebas+Neue&amp;display=swap">
<style>
body{margin:0}
a{color:#007A64}a:hover{color:#005A4A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #F2F6F6; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #0F172A; overflow: hidden;">
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0;">
    <a href="MobileDashboard.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: grid; place-items: center; color: #0F172A;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800; flex: 1;">마켓 업로드</h1>
    <span style="font-size: 12px; color: #475569; padding-right: 10px;">2 / 2 단계</span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 180px; display: flex; flex-direction: column; gap: 12px;">
    <section style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 style="margin: 0; font-size: 14px; font-weight: 700;">보낼 계정 3개</h2><button type="button" style="border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #007A64; padding: 8px 0; cursor: pointer;">바꾸기</button></div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <span style="font-size: 12px; border: 1px solid #00C9A7; background: #E6FBF7; border-radius: 999px; padding: 4px 10px;">쿠팡 1호점</span>
        <span style="font-size: 12px; border: 1px solid #00C9A7; background: #E6FBF7; border-radius: 999px; padding: 4px 10px;">쿠팡 2호점</span>
        <span style="font-size: 12px; border: 1px solid #00C9A7; background: #E6FBF7; border-radius: 999px; padding: 4px 10px;">스마트스토어 1호점</span>
      </div>
    </section>

    <h2 style="margin: 4px 0 0; font-size: 14px; font-weight: 700;">상품 4개</h2>

    <label style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #007A64;">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 700; line-height: 1.4;">접이식 캠핑 의자 사이드 테이블 일체형</span>
        <span style="display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px;"><span style="font-weight: 600; color: #166534; background: #DCFCE7; border-radius: 999px; padding: 1px 8px;">쿠팡1 등록</span><span style="font-weight: 600; color: #166534; background: #DCFCE7; border-radius: 999px; padding: 1px 8px;">쿠팡2 등록</span><span style="font-weight: 600; color: #166534; background: #DCFCE7; border-radius: 999px; padding: 1px 8px;">스스1 등록</span></span>
      </span>
    </label>
    <label style="background: #FFFFFF; border: 1px solid #FECACA; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #007A64;">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 700; line-height: 1.4;">전기 담요 무릎 담요 6단계 온도 조절</span>
        <span style="display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px;"><span style="font-weight: 600; color: #166534; background: #DCFCE7; border-radius: 999px; padding: 1px 8px;">쿠팡1 등록</span><span style="font-weight: 600; color: #166534; background: #DCFCE7; border-radius: 999px; padding: 1px 8px;">쿠팡2 등록</span><span style="font-weight: 600; color: #991B1B; background: #FEE2E2; border-radius: 999px; padding: 1px 8px;">스스1 실패</span></span>
        <span style="font-size: 12px; color: #991B1B;">'정격 전압' 속성을 입력해야 등록됩니다.</span>
      </span>
    </label>
    <label style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #007A64;">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 700; line-height: 1.4;">보온 보냉 스테인리스 텀블러 946ml</span>
        <span style="display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px;"><span style="font-weight: 600; color: #166534; background: #DCFCE7; border-radius: 999px; padding: 1px 8px;">쿠팡1 등록</span><span style="font-weight: 600; color: #1E40AF; background: #DBEAFE; border-radius: 999px; padding: 1px 8px;">쿠팡2 전송 중</span><span style="font-weight: 600; color: #475569; background: #F1F5F9; border-radius: 999px; padding: 1px 8px;">스스1 대기</span></span>
      </span>
    </label>
    <label style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #007A64;">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 700; line-height: 1.4;">비타민C 세럼 30ml 피부 고민 케어</span>
        <span style="display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px;"><span style="font-weight: 600; color: #475569; background: #F1F5F9; border-radius: 999px; padding: 1px 8px;">3개 계정 대기</span></span>
      </span>
    </label>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px;">
      <span><b style="font-family: 'Bebas Neue', sans-serif; font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums;">7 / 12</b> <span style="color: #475569;">완료</span></span>
      <span style="color: #475569; font-variant-numeric: tabular-nums;">성공 6 · 실패 1 · 대기 4</span>
    </div>
    <div role="progressbar" aria-label="전송 진행률" aria-valuenow="58" aria-valuemin="0" aria-valuemax="100" style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #E2E8F0;"><span style="width: 50%; background: #00C9A7;"></span><span style="width: 8.33%; background: #EF4444;"></span><span style="width: 8.33%; background: #93C5FD;"></span></div>
    <div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px;">
      <button type="button" style="height: 48px; border: 1px solid #CBD5E1; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #0F172A; cursor: pointer;">실패 건 다시</button>
      <button type="button" style="height: 48px; border: 0; border-radius: 10px; background: #007A64; font-family: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer;">12건 전송</button>
    </div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</script>
</body>
</html>
